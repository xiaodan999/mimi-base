# Version-controlled reverse-proxy stack for the mimi-base host.
# Replaces the hand-edited (and non-git) /root/main/compose.yaml.
#
# The gateway is reached through `host.docker.internal:host-gateway` (see
# extra_hosts below and the Caddyfile), NOT a hardcoded 172.19.0.1 — so
# recreating the docker bridge network no longer silently breaks the site or
# the deploy endpoints. `caddy-net` is an existing external network; do not
# let Compose recreate it.

services:
    caddy:
        image: caddy:2
        container_name: caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        # Resolve the host (where PocketBase :8090 and the supervisor :9001
        # run) by a stable name that survives network recreation.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - caddy-net

# Other sites on this host (e.g. zx-web, addressed by container DNS as
# zx-web:3000) keep their own compose service / Caddyfile site block; this
# file only owns the dan-pb.zxvcn.com vhost. Merge rather than overwrite when
# applying to a host that serves additional domains.

networks:
    caddy-net:
        external: true

volumes:
    caddy_data:
    caddy_config:
