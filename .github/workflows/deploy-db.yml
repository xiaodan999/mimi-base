name: deploy-db

# Deploys PocketBase (schema migrations + hooks) by calling the server's
# /db/sync endpoint, which does git pull --ff-only, snapshots pb_data and
# restarts PB. Publish is GATED on a successful `ci` run (workflow_call) and
# serialized with deploy-spa through the shared `deploy` concurrency group.
# Requires a deploy secret in the "Production" environment; without one this
# workflow no-ops.

on:
    push:
        branches: [master]
        paths: ["pocketbase/**", ".github/workflows/deploy-db.yml"]
    # First publish on a fresh box, and manual resync after a recovery.
    workflow_dispatch:

# ONE shared group with deploy-spa.yml: a commit touching both backend and
# frontend paths can never run /db/sync (PB restart) and /spa/publish at once.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    # Reusable checks job: typecheck, lint, format:check, unit tests, build.
    # A failure here blocks the deploy entirely (#11).
    ci:
        uses: ./.github/workflows/ci.yml

    sync:
        needs: ci
        runs-on: ubuntu-latest
        # DEPLOY_TOKEN lives in the "Production" environment.
        environment: Production
        env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
            # Repo variable: the PocketBase host exposing /db/sync. Not a
            # secret — it is the public site URL.
            PB_BASE_URL: ${{ vars.PB_BASE_URL }}
        steps:
            # Gate on a configured secret so a fork / fresh box no-ops cleanly.
            - name: Check deploy secret
              id: gate
              run: |
                  if [ -n "${PB_BASE_URL:-}" ] && [ -n "${DEPLOY_TOKEN:-}" ]; then
                      echo "armed=yes" >> "$GITHUB_OUTPUT"
                  else
                      echo "armed=no" >> "$GITHUB_OUTPUT"
                  fi

            - name: Skip (no deploy secret)
              if: steps.gate.outputs.armed != 'yes'
              run: echo "deploy secret or PB_BASE_URL not configured — skipping /db/sync"

            - name: Trigger /db/sync
              if: steps.gate.outputs.armed == 'yes'
              timeout-minutes: 20
              # The CN route from GitHub runners drops out for minutes at a
              # time, so spread attempts over a wider window. A fresh
              # timestamped HMAC is signed per attempt (replay window 300s).
              run: |
                  TOKEN="$DEPLOY_TOKEN"
                  for i in $(seq 1 8); do
                    TS=$(date +%s)
                    SIG=$(printf '%s' "/db/sync.$TS" | openssl dgst -sha256 -hmac "$TOKEN" | awk '{print $NF}')
                    if curl --fail-with-body --max-time 60 -sS -X POST \
                      "$PB_BASE_URL/db/sync" \
                      -H "x-deploy-token: $TOKEN" \
                      -H "x-deploy-ts: $TS" \
                      -H "x-deploy-signature: $SIG"; then
                      echo "deploy triggered on attempt $i"
                      exit 0
                    fi
                    echo "attempt $i failed; retrying in 60s"
                    sleep 60
                  done
                  echo "all attempts failed — the deploy did NOT happen (re-run this job)"
                  exit 1

            - name: Health check
              if: steps.gate.outputs.armed == 'yes'
              run: |
                  curl --fail --max-time 30 -sS --retry 3 --retry-delay 10 --retry-all-errors \
                    "$PB_BASE_URL/api/health"
