name: ci

on:
    push:
        branches: [master]
    pull_request:
    # Reusable: `images` calls this as its `ci` gate, so an image publish can
    # never run before typecheck/lint/format:check/tests pass.
    workflow_call:

# Only read the repository; nothing here pushes or creates releases.
permissions:
    contents: read

concurrency:
    # A called workflow inherits the caller's context, so `github.workflow` is
    # "ci" for a direct push run but "images" for the gate copy `images.yml`
    # calls. Keeping the caller in the group lets the gate and the standalone
    # push run coexist instead of cancelling each other, which otherwise
    # leaves a cancelled "ci / checks" check on the commit.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    # Only drop superseded runs for PRs. Cancelling a push run on `master`
    # shows up as a failed check on the commit, which is not what we want.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install server dependencies
              run: bun run install:server

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Unit tests with coverage
              run: bun run test:coverage

            - name: Build
              run: bun run build

    # Runs against the real pinned PocketBase binary with this checkout's
    # migrations and JSVM hooks. Independent of `checks` so the two run in
    # parallel; no Docker or ffmpeg involved.
    pb-hooks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # scripts/pb-binary.ts downloads the pinned release into this
            # cache when it is missing. The key has to match PB_VERSION there
            # (0.40.6); bump both together. Without a cache hit the job needs
            # the GitHub release and fails visibly when it is unreachable.
            - name: Cache PocketBase binary
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/mimi-base
                  key: pocketbase-${{ runner.os }}-0.40.6

            - name: PocketBase hook tests
              run: bun run test:pb
