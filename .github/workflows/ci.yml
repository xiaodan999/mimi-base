name: ci

on:
    push:
        branches: [master, main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bunx tsc --noEmit

            - name: Lint
              run: bunx eslint .

            - name: Format check
              run: bunx prettier --check .

            - name: Unit tests
              run: bun run test

            - name: Build
              run: bunx vite build
