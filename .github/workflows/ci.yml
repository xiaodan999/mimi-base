name: ci

on:
    push:
        branches: [master]
    pull_request:
    # Reusable: deploy-db / deploy-spa call this as their `ci` gate, so a
    # publish can never run before typecheck/lint/format:check/tests pass.
    workflow_call:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Unit tests
              run: bun run test

            - name: Build
              run: bun run build
