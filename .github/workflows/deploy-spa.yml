name: deploy-spa

# Builds the frontend in CI and publishes it to PocketBase, which serves it
# from ../build (`--publicDir`). Publish is GATED on a successful `ci` run
# (workflow_call) and serialized with deploy-db through the shared `deploy`
# concurrency group. A publish never restarts PB; the Vercel deployment of the
# same commit is unaffected. Requires a deploy secret in "Production".

on:
    push:
        branches: [master]
        paths:
            - "app/**"
            - "components/**"
            - "hooks/**"
            - "lib/**"
            - "public/**"
            - "index.html"
            - "vite.config.ts"
            - "tsconfig.json"
            - "tailwind.config.js"
            - "postcss.config.js"
            - "globals.css"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/deploy-spa.yml"
    # first publish on a fresh box, and manual republish after a rollback
    workflow_dispatch:

# Only read the repository; the publish itself is an HTTP call with DEPLOY_TOKEN.
permissions:
    contents: read

# ONE shared group with deploy-db.yml: /db/sync (PB restart) and
# /spa/publish can never overlap, so no retry loop is needed to dodge a
# supervisor respawn.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    # Reusable checks job (typecheck, lint, format:check, tests, build). Every
    # deploy job below `needs: ci`, so lint/format/tests gate the publish (#11).
    ci:
        uses: ./.github/workflows/ci.yml

    build:
        needs: ci
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build (same-origin API)
              # PocketBase serves this bundle, so the API is whatever host
              # loaded the page. GITHUB_SHA (== github.sha) is baked into
              # build/version.json and build/sw.js by the sw-version plugin.
              run: VITE_POCKETBASE_URL=same-origin bun run build

            - name: Package
              run: tar -czf spa.tar.gz -C build .

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: spa
                  path: spa.tar.gz
                  retention-days: 1
                  if-no-files-found: error

    publish:
        needs: [ci, build]
        runs-on: ubuntu-latest
        environment: Production
        env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
            DEPLOY_SHA: ${{ github.sha }}
            # Repo variable: the PocketBase host that serves this bundle and
            # exposes the deploy endpoints. Not a secret — it is public.
            PB_BASE_URL: ${{ vars.PB_BASE_URL }}
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: spa

            # Gate every deploy/verify step on a configured secret so a fork
            # (or a fresh box before secrets are added) does not fail on the
            # "new bundle is live" assertion after a skipped publish.
            - name: Check deploy secret
              id: gate
              run: |
                  if [ -n "${PB_BASE_URL:-}" ] && [ -n "${DEPLOY_TOKEN:-}" ]; then
                      echo "armed=yes" >> "$GITHUB_OUTPUT"
                  else
                      echo "armed=no" >> "$GITHUB_OUTPUT"
                  fi

            - name: Skip (no deploy secret)
              if: steps.gate.outputs.armed != 'yes'
              run: echo "deploy secret or PB_BASE_URL not configured — skipping publish / repo-sync / verify"

            - name: Publish to PocketBase
              if: steps.gate.outputs.armed == 'yes'
              timeout-minutes: 10
              # Hash the tarball in CI; the server verifies x-spa-sha256 and
              # the HMAC signature before it writes or extracts anything.
              run: |
                  TOKEN="$DEPLOY_TOKEN"
                  BODY_SHA=$(sha256sum spa.tar.gz | awk '{print $1}')
                  for i in $(seq 1 6); do
                    TS=$(date +%s)
                    SIG=$(printf '%s' "/spa/publish.$TS" | openssl dgst -sha256 -hmac "$TOKEN" | awk '{print $NF}')
                    if curl --fail-with-body --max-time 120 -sS -X POST \
                      "$PB_BASE_URL/spa/publish" \
                      -H "x-deploy-token: $TOKEN" \
                      -H "x-deploy-ts: $TS" \
                      -H "x-deploy-signature: $SIG" \
                      -H "x-spa-sha: $DEPLOY_SHA" \
                      -H "x-spa-sha256: $BODY_SHA" \
                      --data-binary @spa.tar.gz; then
                      echo "published on attempt $i"
                      exit 0
                    fi
                    echo "attempt $i failed; retrying in 20s"
                    sleep 20
                  done
                  echo "publish failed — the previous bundle is still live"
                  exit 1

            - name: Sync VPS checkout (pull only)
              if: steps.gate.outputs.armed == 'yes'
              # /spa/publish does NOT update server code. This pull-only
              # endpoint keeps the on-disk checkout at the deployed commit
              # WITHOUT a PB restart (issue #12).
              run: |
                  TOKEN="$DEPLOY_TOKEN"
                  for i in $(seq 1 6); do
                    TS=$(date +%s)
                    SIG=$(printf '%s' "/repo/sync.$TS" | openssl dgst -sha256 -hmac "$TOKEN" | awk '{print $NF}')
                    if RESP=$(curl --fail-with-body --max-time 60 -sS -X POST \
                      "$PB_BASE_URL/repo/sync" \
                      -H "x-deploy-token: $TOKEN" \
                      -H "x-deploy-ts: $TS" \
                      -H "x-deploy-signature: $SIG"); then
                      echo "$RESP"
                      if echo "$RESP" | grep -q "$DEPLOY_SHA"; then
                        echo "VPS checkout is at deployed commit $DEPLOY_SHA"
                        exit 0
                      fi
                      echo "VPS HEAD does not match $DEPLOY_SHA" >&2
                      exit 1
                    fi
                    echo "attempt $i failed; retrying in 20s"
                    sleep 20
                  done
                  echo "repo sync failed" >&2
                  exit 1

            - name: Health check
              if: steps.gate.outputs.armed == 'yes'
              run: |
                  curl --fail --max-time 30 -sS --retry 3 --retry-delay 5 --retry-all-errors \
                    "$PB_BASE_URL/db/api/health"
                  curl --fail --max-time 30 -sS --retry 3 --retry-delay 5 --retry-all-errors \
                    "$PB_BASE_URL/" -o /dev/null

            - name: Verify the NEW bundle is live
              if: steps.gate.outputs.armed == 'yes'
              # A 200 that serves stale code must not pass: assert the served
              # version.json sha equals the commit we just published (#14).
              run: |
                  for i in $(seq 1 10); do
                    GOT=$(curl -sS --max-time 30 \
                      "$PB_BASE_URL/version.json?t=$DEPLOY_SHA" \
                      | jq -r '.sha // empty' 2>/dev/null || true)
                    if [ "$GOT" = "$DEPLOY_SHA" ]; then
                      echo "new bundle live: $GOT"
                      exit 0
                    fi
                    echo "served sha '${GOT:-none}' != $DEPLOY_SHA; retry $i"
                    sleep 6
                  done
                  echo "the NEW bundle is NOT being served (expected $DEPLOY_SHA)" >&2
                  exit 1
