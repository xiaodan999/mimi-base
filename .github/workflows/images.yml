name: images

# Builds the two runtime images and hands them to Watchtower.
#
# The frontend is still built by Vercel independently; this workflow produces
# the self-hosted `mimi-base-app` (Bun API + SPA + QuickJS) and
# `mimi-base-pb` (PocketBase + schema/hooks) images in Aliyun ACR. Watchtower
# watches those container names and only updates when this workflow calls its
# HTTP API, so `deploy` is the actual rollout step.

on:
    push:
        branches: [master]
        paths:
            - "app/**"
            - "components/**"
            - "hooks/**"
            - "lib/**"
            - "public/**"
            - "server/**"
            - "pocketbase/**"
            - "docker/**"
            - "compose.yaml"
            - "index.html"
            - "vite.config.ts"
            - "tsconfig.json"
            - "globals.css"
            - "package.json"
            - "bun.lock"
            - "server/bun.lock"
            - ".github/workflows/images.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: images
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    # Decide which image needs rebuilding. A frontend-only push must not
    # restart PocketBase.
    changes:
        needs: ci
        runs-on: ubuntu-latest
        outputs:
            app: ${{ steps.filter.outputs.app }}
            pb: ${{ steps.filter.outputs.pb }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: filter
              run: |
                  set -euo pipefail
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "app=true" >> "$GITHUB_OUTPUT"
                    echo "pb=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  before="${{ github.event.before }}"
                  if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                    echo "app=true" >> "$GITHUB_OUTPUT"
                    echo "pb=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  files=$(git diff --name-only "$before" "${{ github.sha }}")
                  if echo "$files" | grep -qE '^(app/|components/|hooks/|lib/|public/|server/|index\.html|vite\.config\.ts|tsconfig\.json|globals\.css|package\.json|bun\.lock|docker/app\.Dockerfile)'; then
                    echo "app=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "app=false" >> "$GITHUB_OUTPUT"
                  fi
                  if echo "$files" | grep -qE '^(pocketbase/|docker/pb\.Dockerfile|docker/pb-entrypoint\.sh)'; then
                    echo "pb=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "pb=false" >> "$GITHUB_OUTPUT"
                  fi

    images:
        needs: [ci, changes]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: registry.cn-guangzhou.aliyuncs.com
                  username: ${{ secrets.ALIYUN_DOCKER_USER_NAME }}
                  password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

            - name: Build and push app
              if: needs.changes.outputs.app == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/app.Dockerfile
                  push: true
                  provenance: false
                  sbom: false
                  platforms: linux/amd64
                  build-args: GITHUB_SHA=${{ github.sha }}
                  tags: |
                      registry.cn-guangzhou.aliyuncs.com/${{ secrets.ALIYUN_DOCKER_NAMESPACE }}/mimi-base-app:latest
                      registry.cn-guangzhou.aliyuncs.com/${{ secrets.ALIYUN_DOCKER_NAMESPACE }}/mimi-base-app:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push pb
              if: needs.changes.outputs.pb == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/pb.Dockerfile
                  push: true
                  provenance: false
                  sbom: false
                  platforms: linux/amd64
                  tags: |
                      registry.cn-guangzhou.aliyuncs.com/${{ secrets.ALIYUN_DOCKER_NAMESPACE }}/mimi-base-pb:latest
                      registry.cn-guangzhou.aliyuncs.com/${{ secrets.ALIYUN_DOCKER_NAMESPACE }}/mimi-base-pb:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: [images, changes]
        if: |
            needs.images.result == 'success' &&
            (needs.changes.outputs.app == 'true' || needs.changes.outputs.pb == 'true')
        runs-on: ubuntu-latest
        environment: Production
        env:
            WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
            WATCHTOWER_URL: ${{ secrets.WATCHTOWER_HTTP_API_URL }}
            NAMESPACE: ${{ secrets.ALIYUN_DOCKER_NAMESPACE }}
        steps:
            - name: Check Watchtower configuration
              id: gate
              run: |
                  if [ -n "${WATCHTOWER_TOKEN:-}" ] && [ -n "${WATCHTOWER_URL:-}" ]; then
                    echo "armed=yes" >> "$GITHUB_OUTPUT"
                  else
                    echo "armed=no" >> "$GITHUB_OUTPUT"
                    echo "WATCHTOWER_HTTP_API_TOKEN / WATCHTOWER_HTTP_API_URL missing; images were pushed but not rolled out."
                  fi

            - name: Update app
              if: steps.gate.outputs.armed == 'yes' && needs.changes.outputs.app == 'true'
              run: |
                  set -euo pipefail
                  url="${WATCHTOWER_URL%/}"
                  case "$url" in */v1/update) ;; *) url="$url/v1/update" ;; esac
                  curl -fsS --max-time 300 -G \
                    -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
                    --data-urlencode "image=registry.cn-guangzhou.aliyuncs.com/$NAMESPACE/mimi-base-app" \
                    "$url"

            - name: Update pb
              if: steps.gate.outputs.armed == 'yes' && needs.changes.outputs.pb == 'true'
              run: |
                  set -euo pipefail
                  url="${WATCHTOWER_URL%/}"
                  case "$url" in */v1/update) ;; *) url="$url/v1/update" ;; esac
                  curl -fsS --max-time 300 -G \
                    -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
                    --data-urlencode "image=registry.cn-guangzhou.aliyuncs.com/$NAMESPACE/mimi-base-pb" \
                    "$url"

            - name: Verify app sha
              if: steps.gate.outputs.armed == 'yes' && needs.changes.outputs.app == 'true'
              env:
                  PB_BASE_URL: ${{ vars.PB_BASE_URL }}
              run: |
                  set -euo pipefail
                  for i in $(seq 1 30); do
                    sha=$(curl -fsS "$PB_BASE_URL/version.json?t=${{ github.sha }}" | jq -r '.sha // empty' 2>/dev/null || true)
                    if [ "$sha" = "${{ github.sha }}" ]; then
                      echo "new bundle live: $sha"
                      exit 0
                    fi
                    echo "served sha '${sha:-none}' != ${{ github.sha }}; retry $i"
                    sleep 10
                  done
                  echo "the new bundle is not being served" >&2
                  exit 1
