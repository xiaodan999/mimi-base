<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
        />
        <title>小蛋🏡的秘密基地</title>
        <meta name="description" content="一个记录秘密的秘密基地。" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#c5f4d2"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#0e1512"
        />
        <script>
            // Apply the stored theme before first paint to avoid a flash.
            (() => {
                try {
                    const stored = localStorage.getItem("mimi-theme");
                    const dark =
                        stored === "dark" ||
                        ((!stored || stored === "system") &&
                            window.matchMedia("(prefers-color-scheme: dark)")
                                .matches);
                    document.documentElement.classList.toggle("dark", dark);
                    document.documentElement.style.colorScheme = dark
                        ? "dark"
                        : "light";
                } catch {
                    // Storage can be unavailable in private mode.
                }
            })();
        </script>
        <style>
            /* First paint before the cross-border JS/CSS arrives. Kept inline
               so it works even when every other request is still in flight. */
            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.9rem;
                background: #fbfaf6;
                color: #17352c;
                font-family:
                    -apple-system, BlinkMacSystemFont, "PingFang SC",
                    "Microsoft YaHei", sans-serif;
            }
            .dark #boot-splash {
                background: #0e1512;
                color: #f3efe3;
            }
            .boot-splash__title {
                font-size: 1.5rem;
                font-weight: 600;
                letter-spacing: 0.08em;
            }
            .boot-splash__spinner {
                width: 1.25rem;
                height: 1.25rem;
                border: 2px solid currentColor;
                border-right-color: transparent;
                border-radius: 999px;
                opacity: 0.55;
                animation: boot-spin 0.8s linear infinite;
            }
            .boot-splash__slow {
                margin: 0;
                min-height: 1.5rem;
                font-size: 0.8rem;
                opacity: 0;
                animation: boot-fade 0.4s ease 8s forwards;
            }
            .boot-splash__slow button {
                border: 0;
                background: none;
                padding: 0 0.15rem;
                font: inherit;
                color: inherit;
                text-decoration: underline;
                text-underline-offset: 2px;
                cursor: pointer;
            }
            .boot-splash__slow button:focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 2px;
            }
            @keyframes boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes boot-fade {
                to {
                    opacity: 0.7;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-splash__spinner {
                    animation: none;
                }
                .boot-splash__slow {
                    animation: none;
                    opacity: 0.7;
                }
            }
        </style>
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="基地" />
        <link rel="icon" href="/images/logo192.png" />
        <link rel="apple-touch-icon" href="/images/logo192.png" />
        <link rel="manifest" href="/manifest.json" />
    </head>
    <body>
        <div id="app" style="height: var(--app-vvh, 100dvh)"></div>
        <div id="boot-splash" role="status" aria-label="正在打开秘密基地">
            <div class="boot-splash__title">秘密基地</div>
            <div class="boot-splash__spinner" aria-hidden="true"></div>
            <p class="boot-splash__slow">
                网络有点慢…
                <button type="button" onclick="location.reload()">重试</button>
            </p>
        </div>
        <script type="module" src="/app/main.tsx"></script>
    </body>
</html>
